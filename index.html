<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Old Back TCG — JP Cards For Sale</title>
  <style>
    body{margin:0;font-family:Arial;background:#0b0b0b;color:#fff}
    header{padding:18px 16px;border-bottom:1px solid #222;position:sticky;top:0;background:#0b0b0b}
    h1{margin:0;font-size:18px}
    .sub{opacity:.8;font-size:13px;margin-top:6px}
    .wrap{padding:16px;max-width:1100px;margin:0 auto}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
    .card{background:#141414;border:1px solid #222;border-radius:12px;overflow:hidden;cursor:pointer}
    .card img{width:100%;height:240px;object-fit:cover;display:block;transition:transform .15s ease}
    .card:hover img{transform:scale(1.03)}
    .info{padding:10px}
    .name{font-size:13px;line-height:1.2;margin-bottom:6px}
    .price{color:#00ff9c;font-weight:700}
    .tag{opacity:.7;font-size:12px;margin-top:6px}

    /* modal */
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;padding:18px}
    .modal.open{display:flex}
    .modalBox{max-width:900px;width:100%;background:#0f0f0f;border:1px solid #222;border-radius:14px;overflow:hidden}
    .modalImg{width:100%;max-height:78vh;object-fit:contain;background:#000}
    .modalBar{display:flex;gap:12px;justify-content:space-between;align-items:center;padding:12px 14px;border-top:1px solid #222}
    .btn{background:#1b1b1b;border:1px solid #2a2a2a;color:#fff;padding:8px 10px;border-radius:10px;text-decoration:none;font-size:13px}
    .btn:hover{border-color:#3a3a3a}
  </style>
</head>
<body>

<header>
  <h1>Old Back TCG — Japanese Cards For Sale</h1>
  <div class="sub">Contacto: WhatsApp +54… · IG: @OldBackTCG · Precios en USD · Envío a cargo del comprador</div>
</header>

<div class="wrap">
  <div class="grid" id="grid">

    <!-- DUPLICÁ ESTE BLOQUE POR CARTA -->
    <div class="card" data-name="Dark Charizard (JP) — Rocket Gang" data-price="$350"
      data-img="https://i.imgur.com/ABC123.webp">
      <img src="https://i.imgur.com/ABC123.webp" loading="lazy" alt="Dark Charizard JP">
      <div class="info">
        <div class="name">Dark Charizard (JP) — Rocket Gang</div>
        <div class="price">$350</div>
        <div class="tag">Estado: LP · Holo</div>
      </div>
    </div>
    <!-- FIN BLOQUE -->

  </div>
</div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modalBox">
    <img class="modalImg" id="modalImg" src="" alt="">
    <div class="modalBar">
      <div>
        <div id="modalName" style="font-weight:700"></div>
        <div id="modalPrice" style="opacity:.85"></div>
      </div>
      <div style="display:flex;gap:10px">
        <a class="btn" id="openImg" target="_blank" rel="noreferrer">Abrir imagen</a>
        <button class="btn" id="closeBtn">Cerrar</button>
      </div>
    </div>
  </div>
</div>

<script>
  const modal = document.getElementById("modal");
  const modalImg = document.getElementById("modalImg");
  const modalName = document.getElementById("modalName");
  const modalPrice = document.getElementById("modalPrice");
  const openImg = document.getElementById("openImg");
  const closeBtn = document.getElementById("closeBtn");

  document.getElementById("grid").addEventListener("click", (e) => {
    const card = e.target.closest(".card");
    if(!card) return;
    const name = card.dataset.name || "";
    const price = card.dataset.price || "";
    const img = card.dataset.img || "";
    modalName.textContent = name;
    modalPrice.textContent = price;
    modalImg.src = img;
    openImg.href = img;
    modal.classList.add("open");
  });

  closeBtn.addEventListener("click", () => modal.classList.remove("open"));
  modal.addEventListener("click", (e) => {
    if(e.target === modal) modal.classList.remove("open");
  });
  document.addEventListener("keydown", (e) => {
    if(e.key === "Escape") modal.classList.remove("open");
  });
</script>

</body>
</html>
